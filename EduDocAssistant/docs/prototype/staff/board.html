<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>角色路线 v3 总览</title>
    <link rel="stylesheet" href="./styles.css">
    <style>
      body { min-width: 0; }
      .overview-board { width: 1600px; min-height: 900px; padding: 42px 46px 52px; }
      .overview-board-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
      .overview-board-head h1 { margin: 8px 0 4px; color: var(--brand-800); font-size: 30px; line-height: 40px; }
      .overview-board-head p { margin: 0; color: var(--text-muted); font-size: 13px; line-height: 21px; }
      .overview-grid { display: grid; grid-template-columns: repeat(4, 360px); gap: 18px; }
      .overview-tile { overflow: hidden; border: 1px solid var(--border); border-radius: 8px; background: #fff; box-shadow: 0 5px 18px rgba(15,23,42,.06); }
      .overview-tile-copy { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 13px; border-bottom: 1px solid var(--border); }
      .overview-tile-copy > span { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 6px; color: var(--role-accent); background: var(--role-soft); font-size: 11px; font-weight: 700; }
      .overview-tile-copy strong, .overview-tile-copy small { display: block; }
      .overview-tile-copy strong { color: var(--text); font-size: 12px; line-height: 17px; }
      .overview-tile-copy small { color: var(--text-muted); font-size: 10px; line-height: 14px; }
      .overview-tile img { display: block; width: 360px; height: 225px; object-fit: cover; }
    </style>
  </head>
  <body data-role="teacher">
    <main class="overview-board" id="board">
      <header class="overview-board-head">
        <div><span class="badge info" id="badge">ROLE ROUTE V3</span><h1 id="title">角色路线总览</h1><p>完整页面、统一字号与颜色、页面内交互保留、页面间不跳转。</p></div>
        <span class="route-index-kicker" id="count">27 / 27 SCREENS</span>
      </header>
      <section class="overview-grid" id="grid"></section>
    </main>
    <script>
      const role = new URLSearchParams(location.search).get("role") === "operations" ? "operations" : "teacher";
      const isTeacher = role === "teacher";
      document.body.dataset.role = role;
      document.getElementById("title").textContent = isTeacher ? "教师端 v3 · 27 屏" : "运维端 v3 · 27 屏";
      document.getElementById("badge").textContent = isTeacher ? "TEACHER ROUTE V3" : "OPERATIONS ROUTE V3";
      fetch("./previews/manifest.json")
        .then((response) => response.json())
        .then((manifest) => {
          document.getElementById("count").textContent = manifest[role].length + " / " + manifest[role].length + " SCREENS";
          document.getElementById("grid").innerHTML = manifest[role]
            .map((screen) => '<article class="overview-tile"><div class="overview-tile-copy"><span>' + String(screen.index).padStart(2, "0") + '</span><div><strong>' + screen.title + '</strong><small>' + screen.group + '</small></div></div><img src="./previews/' + role + '/' + screen.file + '" alt="' + screen.title + '"></article>')
            .join("");
        });
    </script>
  </body>
</html>
