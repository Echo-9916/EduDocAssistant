server:
  port: 8080

spring:
  application:
    name: edudoc-backend
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${EDUDOC_DB_USERNAME:user_cidas}
    password: ${EDUDOC_DB_PASSWORD:cidas123}
    driver-class-name: oracle.jdbc.OracleDriver
  data:
    redis:
      host: ${EDUDOC_REDIS_HOST:localhost}
      port: ${EDUDOC_REDIS_PORT:6379}

edudoc:
  ai-service:
    base-url: http://localhost:8000
  oss:
    endpoint: ${EDUDOC_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    region: ${EDUDOC_OSS_REGION:cn-beijing}
    bucket: ${EDUDOC_OSS_BUCKET:cidas-oss-bucket}
    # 敏感项只走环境变量，不入仓
    access-key-id: ${EDUDOC_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${EDUDOC_OSS_ACCESS_KEY_SECRET:}
    # 自定义角色 edudoc-upload（信任本账号 RAM 用户，策略 edudoc-oss-upload）
    role-arn: ${EDUDOC_OSS_ROLE_ARN:acs:ram::1389486492585567:role/edudoc-upload}
    sts-endpoint: ${EDUDOC_OSS_STS_ENDPOINT:sts.cn-beijing.aliyuncs.com}
    object-key-prefix: edudoc/uploads
    session-ttl-minutes: 120
    sts-duration-seconds: 900
  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 50
    max-retry: 5
    stream-keys:
      DOCUMENT_PARSE_REQUESTED: edudoc:stream:document-parse
  parse:
    enabled: true
    concurrency: 2
    stream-key: edudoc:stream:document-parse
    group: cg-document-parse
    chunk-size: 1500
  jwt:
    # 生产必须通过环境变量 EDUDOC_JWT_SECRET 覆盖，长度 >= 32 字节（HS256）
    secret: ${EDUDOC_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef0123456789}
    access-ttl-seconds: 1800

management:
  endpoints:
    web:
      exposure:
        include: health
