server:
  port: 8080

spring:
  application:
    name: edudoc-backend
  servlet:
    multipart:
      # 模板 docx 上传（D-02）与 20MB 文档上限同口径
      max-file-size: 20MB
      max-request-size: 25MB
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${EDUDOC_DB_USERNAME:user_cidas}
    password: ${EDUDOC_DB_PASSWORD:cidas123}
    driver-class-name: oracle.jdbc.OracleDriver
  data:
    redis:
      host: ${EDUDOC_REDIS_HOST:localhost}
      port: ${EDUDOC_REDIS_PORT:6379}

edudoc:
  ai-service:
    base-url: ${EDUDOC_AI_SERVICE_BASE_URL:http://localhost:8000}
    # 服务间共享密钥只走环境变量；缺失时 AI 调用 50301 干净降级，不炸启动
    internal-token: ${EDUDOC_AI_INTERNAL_TOKEN:}
    short-timeout-ms: 10000
    long-timeout-ms: 60000
    # 冒烟校准：真实上游 answer P50≈3.3s P90≈4.7s，4.2s 太紧；4.8s 仍在 P-05 端到端 5s 预算内
    answer-timeout-ms: 4800
  ai:
    llm:
      model: ${EDUDOC_AI_LLM_MODEL:deepseek-ai/DeepSeek-V3}
      temperature: 0.3
    embedding:
      model: ${EDUDOC_AI_EMBEDDING_MODEL:BAAI/bge-m3}
      dimension: 1024
    rerank:
      model: ${EDUDOC_AI_RERANK_MODEL:BAAI/bge-reranker-v2-m3}
  qa:
    # 归一相似度口径 score=max(0,1-cosine距离/2)（真机校准：同文≈0.94、改写问题≈0.78、文档外≈0.50-0.59）
    evidence-threshold: 0.60
    # P-05 问答端到端目标 5s：统一 deadline，剩余时间逐段传给 embed/rerank/answer（1105 审查 P1-3）
    budget-ms: 5000
  oss:
    endpoint: ${EDUDOC_OSS_ENDPOINT:https://oss-cn-beijing.aliyuncs.com}
    region: ${EDUDOC_OSS_REGION:cn-beijing}
    bucket: ${EDUDOC_OSS_BUCKET:cidas-oss-bucket}
    # 敏感项只走环境变量，不入仓
    access-key-id: ${EDUDOC_OSS_ACCESS_KEY_ID:}
    access-key-secret: ${EDUDOC_OSS_ACCESS_KEY_SECRET:}
    # 自定义角色 edudoc-upload（信任本账号 RAM 用户，策略 edudoc-oss-upload）
    role-arn: ${EDUDOC_OSS_ROLE_ARN:acs:ram::1389486492585567:role/edudoc-upload}
    sts-endpoint: ${EDUDOC_OSS_STS_ENDPOINT:sts.cn-beijing.aliyuncs.com}
    object-key-prefix: edudoc/uploads
    session-ttl-minutes: 120
    sts-duration-seconds: 900
  outbox:
    enabled: true
    poll-interval-ms: 1000
    batch-size: 50
    max-retry: 5
    stream-keys:
      DOCUMENT_PARSE_REQUESTED: edudoc:stream:document-parse
      DOCUMENT_EMBED_REQUESTED: edudoc:stream:document-embed
      AI_TASK_REQUESTED: edudoc:stream:ai-task
      FORMAT_CHECK_REQUESTED: edudoc:stream:format-check
      CONVERSION_REQUESTED: edudoc:stream:conversion
      NOTIFICATION_REQUESTED: edudoc:stream:notification
  ai-task:
    enabled: true
    concurrency: 2
    stream-key: edudoc:stream:ai-task
    group: cg-ai-task
    timeout-seconds: 60
    group-chars: 6000
  embed:
    enabled: true
    concurrency: 2
    batch-size: 25
    stream-key: edudoc:stream:document-embed
    group: cg-document-embed
  parse:
    enabled: true
    concurrency: 2
    stream-key: edudoc:stream:document-parse
    group: cg-document-parse
    chunk-size: 1500
  format-check:
    enabled: true
    concurrency: 2
    stream-key: edudoc:stream:format-check
    group: cg-format-check
  # 信箱投递 worker（2-4）；enabled=false 同时停掉临近截止扫描（2-5），避免事件无人消费
  notification:
    enabled: true
    concurrency: 1
    stream-key: edudoc:stream:notification
    group: cg-notification
  conversion:
    enabled: true
    concurrency: 1
    stream-key: edudoc:stream:conversion
    group: cg-conversion
    timeout-ms: 120000
  jwt:
    # 生产必须通过环境变量 EDUDOC_JWT_SECRET 覆盖，长度 >= 32 字节（HS256）
    secret: ${EDUDOC_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef0123456789abcdef0123456789}
    access-ttl-seconds: 1800

management:
  endpoints:
    web:
      exposure:
        include: health
